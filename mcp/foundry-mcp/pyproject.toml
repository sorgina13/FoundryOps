[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-mcp"
version = "1.0.0"
description = "MCP server exposing Azure AI Foundry tools to copilots and MCP clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.5.0",
    "azure-identity>=1.20.0",
    "azure-ai-ml>=1.22.0",
    "azure-keyvault-secrets>=4.9.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "anyio>=4.8.0",
]

[project.scripts]
foundry-mcp = "foundry_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
